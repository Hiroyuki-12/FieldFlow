name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# CIはソースコードの検証だけを行うため、リポジトリへの書き込み権限を与えない。
permissions:
  contents: read

# 同じブランチへ新しいcommitが追加された場合、古い検証を止めて最新の結果を優先する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      # Actionは完全なcommit SHAで固定し、意図しない更新や改ざんの影響を受けにくくする。
      - name: ソースコードを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.jsとnpmキャッシュを準備する
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: lockfileどおりに依存パッケージをインストールする
        run: npm ci

      - name: lintを実行する
        run: npm run lint

      - name: 型チェックを実行する
        run: npm run typecheck

      - name: 単体・コンポーネントテストを実行する
        run: npm test -- --run

      - name: 本番用ファイルをbuildする
        run: npm run build

      - name: Frontendのbuild成果物を保存する
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: ソースコードを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.jsとnpmキャッシュを準備する
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: lockfileどおりに依存パッケージをインストールする
        run: npm ci

      - name: lintを実行する
        run: npm run lint

      - name: 型チェックを実行する
        run: npm run typecheck

      - name: 単体テストを実行する
        run: npm test

      - name: 結合テストを実行する
        run: npm run test:integration

      - name: Backendをbuildする
        run: npm run build

      - name: Backendのbuild成果物を保存する
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-dist-${{ github.sha }}
          path: backend/dist
          if-no-files-found: error
          retention-days: 7
